# Fly.io configuration for AnyCable Go backend
# See: https://fly.io/docs/reference/configuration/

app = 'thqnam-anycable-go'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = 'off'
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '2gb'
